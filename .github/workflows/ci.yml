name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, typecheck, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      # mongodb-memory-server downloads a mongod binary on first use; cache it between runs.
      - name: Cache MongoDB binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            mongodb-binaries-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: |
          npm run typecheck -w backend
          npm run typecheck -w frontend

      - name: Build
        run: npm run build

      # Tests set their own JWT secret and use an in-memory MongoDB: no secrets or services needed.
      - name: Test
        run: npm test
        env:
          # Otherwise the binary lands in node_modules/.cache, which npm ci wipes, and the cache never hits.
          MONGOMS_DOWNLOAD_DIR: ${{ runner.temp }}/mongodb-binaries
